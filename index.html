<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Immersive Portfolio</title>
    <meta name="description" content="An immersive portfolio showcasing my work and tools">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="preloader.css" as="style">
    <link rel="preload" href="preloader.js" as="script">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js" as="script">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js" as="script">
    
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <!-- CSS -->
    <link rel="stylesheet" href="preloader.css">
    <link rel="stylesheet" href="main.css">
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</head>
<body>
    <!-- Preloader -->
    <div class="preloader">
        <div class="preloader-inner">
            <div class="preloader-spinner"></div>
            <div class="preloader-text" data-text="LOADING...">LOADING...</div>
            <div class="preloader-progress">
                <div class="preloader-progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Main Content (initially hidden) -->
    <div class="main-content" style="opacity: 0;">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title" data-splitting>Welcome to My Immersive World</h1>
                <p class="hero-subtitle" data-splitting>Developer | Creator | Innovator</p>
                <div class="scroll-indicator">
                    <span class="scroll-text">Scroll</span>
                    <div class="scroll-line"></div>
                </div>
            </div>
        </section>

        <!-- About Section -->
        <section class="about">
            <h2 class="section-title" data-splitting>About Me</h2>
            <div class="about-content">
                <div class="about-text">
                    <p data-scroll>Your professional introduction goes here...</p>
                </div>
                <div class="about-image" data-scroll>
                    <img src="assets/images/profile.jpg" alt="Profile Image" loading="lazy">
                </div>
            </div>
        </section>

        <!-- Tools & Apps Section -->
        <section class="tools-apps">
            <h2 class="section-title" data-splitting>My Tools & Applications</h2>
            <div class="apps-grid">
                <!-- App 1 -->
                <div class="app-card" data-scroll>
                    <div class="app-card-inner">
                        <h3>Web App 1</h3>
                        <p>Description of your web application</p>
                        <a href="/apps/app1" class="app-link" data-cursor="hover">Launch App</a>
                    </div>
                </div>
                
                <!-- Python Tool 1 -->
                <div class="app-card" data-scroll>
                    <div class="app-card-inner">
                        <h3>Python Tool 1</h3>
                        <p>Description of your Python tool</p>
                        <a href="/tools/tool1" class="app-link" data-cursor="hover">Run Tool</a>
                    </div>
                </div>
                
                <!-- More apps/tools... -->
            </div>
        </section>

        <!-- Contact Section -->
        <section class="contact">
            <h2 class="section-title" data-splitting>Get In Touch</h2>
            <form class="contact-form" data-scroll>
                <!-- Form fields -->
            </form>
        </section>
    </div>

    <!-- Cursor Effect -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- JavaScript Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/splitting/dist/splitting.min.js"></script>
    
    <!-- Main Scripts -->
    <script src="preloader.js"></script>
    <script src="gsap-animations.js"></script>
    <script src="main.js"></script>
</body>
</html>
